name: waypay_mobile
description: "A new Flutter project."
publish_to: "none"
version: 2.1.0+3

environment:
  sdk: ^3.8.1

dependencies:
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_slidable: ^3.1.0
  flutter_multi_formatter: ^2.13.7
  flutter_svg: ^2.2.0
  get_it: ^8.0.3
  go_router: ^17.3.0
  http_parser: ^4.0.2
  web_socket_channel: ^3.0.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  mask_text_input_formatter: ^2.9.0
  mime: ^1.0.4
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  fl_chart: ^1.0.0
  equatable: ^2.0.7
  connectivity_plus: ^6.1.4
  file_picker: ^10.2.0
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  excel: ^4.0.6
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  share_plus: ^11.1.0
  path: ^1.9.1
  file_saver: ^0.3.1
  flutter_file_dialog: ^3.0.2
  pdf: ^3.11.3
  printing: ^5.14.2
  signalr_netcore: ^1.4.3
  chewie: ^1.12.1
  video_player: ^2.10.0
  video_thumbnail: ^0.5.6
  flutter_link_previewer: ^4.1.2
  flutter_launcher_icons: ^0.14.4
  http: ^1.5.0
  audioplayers: ^6.7.1
  waypay_flutter_library:
    path: packages/waypay_styles

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true
